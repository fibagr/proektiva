# HTTP -> HTTPS redirect
server {
    listen 80;
    #listen [::]:80;
    server_name tppsychology.com;

    return 301 https://$host$request_uri;
}

# HTTPS endpoint
server {
    listen 443 ssl http2;
    #listen [::]:443 ssl http2;
    server_name tppsychology.com;

    # пути к сертификатам внутри контейнера
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # базовая защита
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # можно докрутить ciphers, HSTS и т.п.

    # проксирование на сервис ai-module в docker-сети
    location / {
        proxy_pass http://ai-module:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # таймауты, если запросы к ИИ долгие
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    location = /hc {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
