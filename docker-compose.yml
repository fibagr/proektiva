version: "3.9"

services:
  ai-module:
    container_name: ai-module
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8000"            # только внутри docker-сети
    restart: unless-stopped
    networks:
      - ai-net

  nginx:
    container_name: ai-nginx
    image: nginx:alpine
    depends_on:
      - ai-module
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # конфиг nginx
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # сертификаты
      - ./nginx/certs:/etc/nginx/certs:ro
      # опционально: логи
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/hc"]
      interval: 30s
      timeout: 3s
      retries: 3    

networks:
  ai-net:
    driver: bridge
